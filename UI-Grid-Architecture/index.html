<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Bento Grid Layout - UI Architecture Portfolio">
    <title>UI Grid Architecture | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <section class="tile main-feature">
            <span class="badge">System Active</span>
            <h1>UI Architecture</h1>
            <p>Mastering modular design systems and responsive grid layouts for scalable web applications.</p>
        </section>

        <article class="tile metric">
            <h3>Performance</h3>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <span class="status-text">92% Optimized</span>
        </article>

        <article class="tile status">
            <h3>Deployment</h3>
            <p>GitHub Main Branch</p>
            <div class="indicator-group">
                <span class="dot"></span>
                <span class="label">Production Live</span>
            </div>
        </article>

        <article class="tile tech-stack">
            <h3>Core Stack</h3>
            <ul class="stack-list">
                <li>HTML5 Semantic</li>
                <li>CSS Grid</li>
                <li>Modern UI/UX</li>
            </ul>
        </article>
    </div>

</body>
</html>
