<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth | UI Architect Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>Create Account</h2>
            <p>Join our professional network today.</p>
            
            <form id="registrationForm" novalidate>
                <div class="input-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" placeholder="Name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="email@gmail.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword">Show</button>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span id="strengthText" class="helper-text">Enter a secure password</span>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Register Now</button>
            </form>
            <p class="footer-text">Already have an account? <a href="#">Login</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
